# Meridian Logistics — local stack.
#
# Host port map (this file is the authority):
#
#   orders          -> http://localhost:8001
#   inventory       -> http://localhost:8012
#   customers       -> http://localhost:8003
#   shipping-mock   -> http://localhost:8004
#   legacy-billing  -> grpc://localhost:50051
#
# Databases live inside the containers, so `docker compose down` throws the data
# away and the next `up` re-seeds from shared/seed-data. That is intentional:
# every run starts from the same fixture.

services:
  orders:
    build: ./services/orders
    # Express listens on 8001 in the container.
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: "file:/app/data/orders.db"
      SEED_DATA_DIR: /seed
      MERIDIAN_JWT_SECRET: ${MERIDIAN_JWT_SECRET:-meridian-dev-secret-not-for-production}
    volumes:
      - ./shared/seed-data:/seed:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inventory:
    build: ./services/inventory
    # uvicorn listens on 8000 in the container; 8002 on the host was already
    # taken by the old warehouse dashboard, so we moved it to 8012.
    ports:
      - "8012:8000"
    environment:
      DATABASE_URL: "sqlite:////app/data/inventory.db"
      SEED_DATA_DIR: /seed
      MERIDIAN_JWT_SECRET: ${MERIDIAN_JWT_SECRET:-meridian-dev-secret-not-for-production}
    volumes:
      - ./shared/seed-data:/seed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  customers:
    build: ./services/customers
    # Go net/http listens on 8003 in the container.
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      CUSTOMERS_DB: /app/data/customers.db
      SCHEMA_PATH: /app/schema.sql
      SEED_DATA_DIR: /seed
      ORDERS_URL: http://orders:8001
      MERIDIAN_JWT_SECRET: ${MERIDIAN_JWT_SECRET:-meridian-dev-secret-not-for-production}
    volumes:
      - ./shared/seed-data:/seed:ro
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  shipping-mock:
    build: ./services/shipping-mock
    # Third-party sandbox stand-in; 8004 on both sides.
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      SEED_DATA_DIR: /seed
      SHIPSTREAM_API_KEY: ${SHIPSTREAM_API_KEY:-ss_sandbox_7f3a9c21b6e04d5f}
    volumes:
      - ./shared/seed-data:/seed:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  legacy-billing:
    build: ./services/legacy-billing
    # gRPC, no HTTP interface. 50051 is the grpc-js default.
    ports:
      - "50051:50051"
    environment:
      PORT: 50051
      SEED_DATA_DIR: /seed
    volumes:
      - ./shared/seed-data:/seed:ro
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
